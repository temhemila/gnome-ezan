name: Update Prayer Times

on:
  schedule:
    - cron: '17 2 * * *'
      timezone: 'Europe/Istanbul'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prayer-times-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch, parse and validate
        run: python scripts/update_prayer_times.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/prayer-times.json

          if git diff --cached --quiet; then
            echo "Veri değişmedi; commit gerekmiyor."
            exit 0
          fi

          git commit -m "chore(data): auto-update prayer times"
          git push
